[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-pareto"
version = "0.1.0"
description = "Multi-objective optimization tracking Pareto frontiers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "numpy>=1.20",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
autoresearch-pareto = "autoresearch_pareto.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
