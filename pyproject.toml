[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pareto-frontier"
version = "0.1.0"
description = "Multi-objective optimization tracking Pareto frontiers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "numpy>=1.20",
    "matplotlib>=3.5",
    "scikit-learn>=1.0",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
llm = [
    "anthropic>=0.20",
]

[project.scripts]
pareto-frontier = "pareto_frontier.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
